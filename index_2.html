<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Gloseboka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: en ringperm med fargede arkfaner øverst, linjert gloseark under. Bevisst ett lyst papir-uttrykk. */
:root{
  color-scheme: light;
  --desk:#dfe9f3;
  --paper:#fffdf7;
  --line:#cfe0f5;
  --margin:#f3a6a6;
  --ink:#2b2d42;
  --soft:#6b6f8a;
  --good:#1f9d55;
  --good-bg:#dcf7e6;
  --oops:#e4572e;
  --oops-bg:#ffe7de;
  --hint:#f5a524;
  --tab1:#ff7a59; --tab2:#ffc93c; --tab3:#4cc3ff; --tab4:#5fd39a; --tab5:#b388ff; --tab6:#ff8fb8; --tab7:#2ec4b6; --tab8:#ffa94d; --tab9:#9bd16a;
  --f-display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-word:"Andika","Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--tab3);outline-offset:2px}

/* Topp */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:34px}
.brand h1{font-size:clamp(28px,6vw,40px);font-weight:800;color:var(--ink)}
.brand small{display:block;font-family:var(--f-body);font-size:14px;color:var(--soft);font-weight:700}
.stars-total{background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 2px 0 #b9c8d8;font-variant-numeric:tabular-nums}

.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voice{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--soft)}
.voice select{font:inherit;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid #c9d6e6;border-radius:10px;padding:4px 8px;max-width:220px}
.voice-note{font-size:13px;font-weight:700;color:#7a4b00;background:#fff3d6;border-radius:10px;padding:4px 10px}

.dir{display:flex;background:var(--paper);border-radius:999px;padding:3px;box-shadow:0 2px 0 #b9c8d8}
.dir button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;color:var(--soft)}
.dir button[aria-pressed="true"]{background:var(--ink);color:#fff}
.eng.nor{background:#fff}
.ask{display:block;font-weight:800;color:var(--soft);font-size:15px;margin-bottom:4px}

/* Arkfaner */
.tabs{display:flex;gap:6px;padding-left:18px;flex-wrap:wrap}
.tab{border:0;border-radius:14px 14px 0 0;padding:8px 18px 10px;font-family:var(--f-display);font-weight:800;font-size:17px;background:#c7d5e4;color:var(--soft);position:relative;top:4px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);top:0;padding-bottom:14px}
.tab .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tab1);margin-right:8px;vertical-align:middle}
.tab.soon{cursor:default;opacity:.75;font-weight:600}

/* Ark */
.sheet{background:var(--paper);border-radius:4px 18px 18px 18px;box-shadow:0 6px 0 #b9c8d8;position:relative;padding:22px 20px 28px 44px;
  background-image:linear-gradient(to right,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px);
  min-height:420px}
.sheet::before{content:"";position:absolute;left:8px;top:28px;bottom:28px;width:12px;
  background:radial-gradient(circle,var(--desk) 5px,transparent 6px) 0 0/12px 72px repeat-y}
@media (max-width:520px){.sheet{padding-left:34px;padding-right:14px}.sheet{background-image:linear-gradient(to right,transparent 24px,var(--margin) 24px,var(--margin) 26px,transparent 26px)}.sheet::before{left:5px}}

/* Oversikt */
.ov-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ov-head h2{font-size:28px}
.ov-head p{margin:0;color:var(--soft);font-weight:700}
.progress{height:14px;background:#eef2f8;border-radius:999px;overflow:hidden;margin:12px 0 20px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tab1),var(--tab2),var(--tab4));border-radius:999px;transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border:0;border-radius:20px;padding:16px 12px 14px;text-align:center;background:var(--c);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.card:hover{transform:translateY(-3px) rotate(-1deg)}
.card:active{transform:translateY(2px)}
.card .emo{font-size:46px;line-height:1.1}
.card .emo small{font-size:24px}
.card .w{font-family:var(--f-word);font-weight:700;font-size:21px;background:rgba(255,255,255,.75);border-radius:10px;padding:0 10px}
.card .st{font-size:15px;letter-spacing:2px;min-height:22px}
.card.done{outline:4px solid #fff;outline-offset:-8px}
.finish{margin-top:22px;padding:16px;border-radius:16px;background:var(--good-bg);font-weight:800;text-align:center;font-size:19px}
.reset{margin-top:18px;background:none;border:0;color:var(--soft);text-decoration:underline;font-size:14px}
.confirm-reset{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}

/* Ordside */
.back{border:0;background:#eef2f8;border-radius:999px;padding:6px 14px;font-weight:800;color:var(--ink)}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:16px 0 8px;padding:16px;border-radius:22px;background:var(--c)}
.hero .big{font-size:76px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12));animation:bob 2.4s ease-in-out infinite}
.hero .big small{font-size:38px}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.hero .txt{min-width:0;flex:1}
.hero .eng{font-family:var(--f-word);font-weight:700;font-size:clamp(36px,9vw,56px);line-height:1;background:rgba(255,255,255,.8);border-radius:14px;padding:4px 14px;display:inline-block}
.hero .ex{margin:8px 0 0;font-weight:700;font-style:italic}
.say{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.step{margin-top:22px}
.step h3{font-size:23px;display:flex;align-items:center;gap:10px}
.step h3 .num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px}
.step p.lead{margin:4px 0 10px;color:var(--soft);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{font-family:var(--f-word);font-size:24px;padding:8px 14px;border-radius:14px;border:3px solid #c9d6e6;background:#fff;color:var(--ink);min-width:0;flex:1 1 220px;max-width:420px}
.inp.ok{border-color:var(--good);background:var(--good-bg)}
.inp.no{border-color:var(--oops);background:var(--oops-bg)}
.btn{border:0;border-radius:14px;padding:10px 20px;font-family:var(--f-display);font-weight:800;font-size:19px;background:var(--tab4);color:#123;box-shadow:0 4px 0 #2f9a66}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f9a66}
.btn.alt{background:var(--tab2);box-shadow:0 4px 0 #c99a10}
.btn.ghost{background:#eef2f8;box-shadow:0 4px 0 #c3cfdd}
.fb{margin-top:10px;padding:10px 14px;border-radius:14px;font-weight:800;font-size:18px}
.fb.ok{background:var(--good-bg);color:#11603a}
.fb.no{background:var(--oops-bg);color:#9a3412}
.fb.hint{background:#fff3d6;color:#7a4b00}

/* Skrivelinjer */
.lines{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:6px}
.lines > div{min-width:0}
.wline{display:flex;align-items:center;gap:10px}
.wline .n{font-family:var(--f-display);font-weight:800;color:var(--soft);width:22px;text-align:right;flex:none}
.wline input{flex:1;min-width:0;width:100%;font-family:var(--f-word);font-size:26px;border:0;border-bottom:3px dashed var(--line);background:transparent;padding:4px 6px;color:var(--ink)}
.wline input:focus{border-bottom-color:var(--tab3);outline:none;background:#f3f9ff}
.wline .mark{font-size:26px;width:34px;flex:none;text-align:center}
.wline.ok input{border-bottom:3px solid var(--good);background:var(--good-bg)}
.wline.no input{border-bottom:3px solid var(--oops);background:var(--oops-bg)}
.fix{margin:2px 0 0 32px;font-family:var(--f-word);font-size:22px;letter-spacing:1px}
.fix .g{color:var(--good)}
.fix .r{color:var(--oops);text-decoration:underline wavy;text-underline-offset:5px}
.fix .m{color:var(--hint)}
.fix .lbl{font-family:var(--f-body);font-size:14px;color:var(--soft);letter-spacing:0;margin-right:6px;font-weight:700}
.hideword #engWord,.hideword .hero .ex,.hideword #say,.hideword #talkEx{visibility:hidden}
.hideword .wref{display:none}
.wscr{display:none}
.wscr b{font-family:var(--f-word);letter-spacing:2px}
.hideword .wscr{display:inline}
.tiles{display:none;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.hideword .tiles{display:flex}
.tile{border:0;width:46px;height:52px;border-radius:12px;background:var(--tab2);box-shadow:0 4px 0 #c99a10;font-family:var(--f-word);font-weight:700;font-size:26px;color:var(--ink);display:grid;place-items:center}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #c99a10}
.tile.back{background:#eef2f8;box-shadow:0 4px 0 #c3cfdd;font-size:20px;width:auto;padding:0 12px}
.tiles-help{display:none;font-size:14px;font-weight:700;color:var(--soft);margin:0}
.hideword .tiles-help{display:block}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--soft);font-size:15px}
.toggle input{width:20px;height:20px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:3px dotted var(--line)}

/* Hør og si etter */
.talk{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:18px;background:#eef6ff;font-size:19px}
.talk.mic{background:#fff3d6}
.talk.done{background:#f3eefe}
.talk .bubble{font-size:40px;line-height:1}
.talk .count{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--oops);font-variant-numeric:tabular-nums}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.btn:disabled{opacity:.6;cursor:wait}
.lvl{flex-basis:100%;height:10px;background:#fff;border-radius:999px;overflow:hidden}
.lvl span{display:block;height:100%;background:linear-gradient(90deg,var(--tab4),var(--tab2),var(--tab1));transition:width .1s}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* Lesetekst */
.lead-story{margin:0 0 14px;color:var(--soft);font-weight:700}
.part{background:var(--c);border-radius:22px;padding:16px;margin-top:18px}
.part-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.part-head > div{flex:1 1 180px;min-width:0}
.part-emo{font-size:44px;line-height:1}
.part-head h3{font-size:26px}
.part-head small{font-weight:700;color:var(--soft)}
.sents{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sent{display:flex;align-items:flex-start;gap:12px;background:rgba(255,255,255,.85);border-radius:16px;padding:10px 12px}
.s-emo{font-size:30px;line-height:1.2;flex:none;width:72px;text-align:center}
.s-txt{flex:1;min-width:0}
.s-en{font-family:var(--f-word);font-size:22px;font-weight:700;line-height:1.35}
.s-no{color:var(--soft);font-weight:700;font-style:italic;margin-top:2px}
.s-btns{display:flex;gap:6px;flex:none}
.s-btns .say{padding:6px 10px;font-size:18px}
.s-talk .talk{font-size:16px;padding:8px 12px}
.s-talk .talk .bubble{font-size:28px}
.s-talk .talk .count{font-size:28px}
.say.mini{padding:2px 8px;font-size:14px;vertical-align:middle;font-style:normal}
.s-en{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{border:0;border-radius:999px;background:#fff;padding:5px 12px;font-family:var(--f-word);font-weight:700;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.chip span{color:var(--soft);font-weight:400}
@media (max-width:520px){.sent{display:grid;grid-template-columns:1fr auto;gap:6px 10px}.s-emo{width:auto;text-align:left}.s-txt{grid-column:1/-1;grid-row:2}.part{padding:12px}}

/* Konfetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.hero .big{animation:none}.card{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo" aria-hidden="true">📒</span><div><h1>Gloseboka</h1><small>Engelsk og norsk</small></div></div>
    <div class="topright">
      <div class="dir" role="group" aria-label="Retning">
        <button type="button" data-dir="en-no">Engelsk → norsk</button>
        <button type="button" data-dir="no-en">Norsk → engelsk</button>
      </div>
      <label class="voice" for="voiceSel"><span aria-hidden="true">👩‍🏫</span> Stemme
        <select id="voiceSel" hidden></select></label>
      <span class="voice-note" id="voiceNote">Fant ingen engelsk stemme ennå. Bruk Chrome eller Edge.</span>
      <div class="stars-total" id="starsTotal">⭐ 0 / 20</div>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main class="sheet" id="sheet"></main>
</div>
<canvas id="confetti"></canvas>

<script>
const TESTS = [
  { id:"p1", name:"Prøve 1", words:[
    { id:"reporting", en:"reporting", emo:"🎤", side:"📺", c:"var(--tab1)", ex:"She is reporting the news.", no:["rapportering","rapportere","rapporterer","reportasje","melde","melder","rapporterte"], show:"rapportering / å rapportere" },
    { id:"exhausted", en:"exhausted", emo:"😫", side:"💤", c:"var(--tab5)", ex:"I am exhausted after football.", no:["utslitt","utmattet","sliten","helt sliten","kjempesliten","gåen","dødssliten","trøtt og sliten"], show:"utslitt / utmattet" },
    { id:"plane", en:"plane", emo:"✈️", side:"☁️", c:"var(--tab3)", ex:"The plane flies over the clouds.", no:["fly","flyet","flymaskin","et fly","flyene"], show:"fly" },
    { id:"travel", en:"travel", emo:"🧳", side:"🌍", c:"var(--tab2)", ex:"We travel to Spain in the summer.", no:["reise","reiser","reising","reiste","dra på tur","feriere"], show:"reise / å reise" },
    { id:"different", en:"different", emo:"🦓", side:"🐴", c:"var(--tab6)", ex:"A zebra is different from a horse.", no:["forskjellig","forskjellige","annerledes","ulik","ulike","annen","annet","andre"], show:"forskjellig / annerledes" },
    { id:"scored", en:"scored", emo:"⚽", side:"🥅", c:"var(--tab4)", ex:"He scored a goal.", no:["scoret","skåret","scora","skåra","scora mål","scoret mål","skåret mål","fikk poeng","fikk mål","laget mål","lagde mål"], show:"scoret / skåret" },
    { id:"journalist", en:"journalist", emo:"📰", side:"✍️", c:"var(--tab7)", ex:"The journalist writes for a newspaper.", no:["journalist","journalisten","journalister","reporter"], show:"journalist" },
    { id:"tournament", en:"tournament", emo:"🏆", side:"🥇", c:"var(--tab8)", ex:"Our team won the tournament.", no:["turnering","turneringen","turneringer","konkurranse","cup","cupen","mesterskap"], show:"turnering" },
    { id:"explore", en:"explore", emo:"🧭", side:"🗺️", c:"var(--tab9)", ex:"Let's explore the forest.", no:["utforske","utforsker","utforsket","oppdage","oppdager","undersøke","undersøker","gå på oppdagelse","oppdagelse"], show:"utforske" }
  ]},
  { id:"p2", name:"Prøve 2", words:[
    { id:"child", en:"child", emo:"🧒", side:"🧸", c:"var(--tab1)", ex:"The child is playing in the garden.", no:["barn","barnet","et barn","unge","ungen"], show:"barn" },
    { id:"school", en:"school", emo:"🏫", side:"🎒", c:"var(--tab2)", ex:"I walk to school every day.", no:["skole","skolen","en skole"], show:"skole" },
    { id:"teacher", en:"teacher", emo:"🧑‍🏫", side:"📚", c:"var(--tab3)", ex:"Our teacher reads a story.", no:["lærer","læreren","lærerinne","lærerinnen","en lærer"], show:"lærer" },
    { id:"friend", en:"friend", emo:"👫", side:"💛", c:"var(--tab4)", ex:"My friend lives next door.", no:["venn","vennen","venninne","venninna","venninnen","venner","kompis","bestevenn"], show:"venn / venninne" },
    { id:"castle", en:"castle", emo:"🏰", side:"👑", c:"var(--tab5)", ex:"The king lives in a big castle.", no:["slott","slottet","borg","borgen","et slott"], show:"slott" },
    { id:"magic", en:"magic", emo:"🪄", side:"✨", c:"var(--tab6)", ex:"The wizard can do magic.", no:["magi","magien","magisk","trylling","trylle","trylleri","trolldom","tryllekunst"], show:"magi / trylling" },
    { id:"owl", en:"owl", emo:"🦉", side:"🌙", c:"var(--tab7)", ex:"The owl flies at night.", no:["ugle","ugla","uglen","en ugle"], show:"ugle" },
    { id:"broom", en:"broom", emo:"🧹", side:"🧙", c:"var(--tab8)", ex:"The witch flies on a broom.", no:["kost","kosten","sopelime","sopelimen","feiekost","kosteskaft","heksekost"], show:"kost / sopelime" },
    { id:"forest", en:"forest", emo:"🌲", side:"🍄", c:"var(--tab9)", ex:"We go for a walk in the forest.", no:["skog","skogen","en skog"], show:"skog" },
    { id:"secret", en:"secret", emo:"🤫", side:"🔐", c:"var(--tab1)", ex:"Can you keep a secret?", no:["hemmelighet","hemmeligheten","hemmelig","en hemmelighet"], show:"hemmelighet" }
  ]},
  { id:"dreams", name:"Dreams", type:"story", title:"Dreams 🌙 Drømmer", parts:[
    { en:"My dream last night", no:"Drømmen min i natt", emo:"😴🌙", c:"#e6ddff",
      lines:[
        { emo:"😴💭", en:"Last night I had a dream.", no:"I natt hadde jeg en drøm." },
        { emo:"🐴🐱", en:"I dreamed about a horse and a cat.", no:"Jeg drømte om en hest og en katt." },
        { emo:"🐴💛🐱", en:"The horse and the cat were best friends.", no:"Hesten og katten var bestevenner." },
        { emo:"🧳✈️", en:"They travelled to Italy by plane.", no:"De reiste til Italia med fly." },
        { emo:"🍕😋", en:"In Italy they ate Italian pizza.", no:"I Italia spiste de italiensk pizza." },
        { emo:"🐱🧀🐴🍅", en:"The cat loved the cheese, and the horse loved the tomatoes.", no:"Katten elsket osten, og hesten elsket tomatene." }
      ],
      vocab:[["dream","drøm"],["dreamed","drømte"],["horse","hest"],["cat","katt"],["best friends","bestevenner"],["Italy","Italia"]] },
    { en:"My big dream", no:"Den store drømmen min", emo:"💪🏆", c:"#ffe1cc",
      lines:[
        { emo:"🌟💭", en:"I have a big dream.", no:"Jeg har en stor drøm." },
        { emo:"🌍🏆", en:"I dream about being the strongest in the world.", no:"Jeg drømmer om å bli verdens sterkeste." },
        { emo:"📅🏋️", en:"Every day I work hard and lift weights.", no:"Hver dag jobber jeg hardt og løfter vekter." },
        { emo:"🏋️‍♀️😤", en:"I lift heavy weights.", no:"Jeg løfter tunge vekter." },
        { emo:"🙌👩😂", en:"I can lift my mum.", no:"Jeg kan løfte mammaen min." }
      ],
      vocab:[["strong","sterk"],["the strongest","den sterkeste"],["lift","løfte"],["heavy","tung"],["weights","vekter"],["every day","hver dag"]] }
  ]}
];

const PRAISE = ["Supert 🌟","Du er rå 💪","Kjempebra 🎉","Helt riktig 😄","Wow, så flink 🚀","Perfekt 🏆"];
const TRY = ["Nesten. Prøv en gang til 🙂","Ikke helt ennå. Du klarer det 💛","Godt forsøk. Prøv igjen 🌈"];
const pick = a => a[Math.floor(Math.random()*a.length)];

let progress = {};
try { progress = JSON.parse(localStorage.getItem("gloseboka-v1")) || {}; } catch(e) { progress = {}; }
function save(){ try { localStorage.setItem("gloseboka-v1", JSON.stringify(progress)); } catch(e){} }
function prog(t,w){ progress[t] ??= {}; return progress[t][w] ??= { trans:false, write:0, tries:0 }; }

let state = { test:(TESTS.filter(t=>t.type!=="story").slice(-1)[0]||TESTS[0]).id, word:null, confirmReset:false, dir:"en-no" }; // åpner nyeste prøve
try { state.hide = localStorage.getItem("gloseboka-scr")==="1"; } catch(e){}
try { const d = localStorage.getItem("gloseboka-dir"); if (d==="no-en"||d==="en-no") state.dir=d; } catch(e){}
const rev = () => state.dir==="no-en";
const nod = w => w.nod || w.show.split(" / ")[0];
const label = w => rev() ? nod(w) : w.en;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => s.toLowerCase().trim().replace(/^å\s+/,"").replace(/^(et|en|ei)\s+/,"").replace(/[.,!?]/g,"").replace(/\s+/g," ");

function solved(p){ return rev() ? !!p.transEn : !!p.trans; }
function scramble(word){
  const a=[...word]; if (new Set(a).size<2) return word;
  let out=word, n=0;
  while ((out===word) && n++<20){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } out=a.join(""); }
  return out;
}
const REPS = 2; // antall ganger ordet skal skrives
function stars(t,w){ const p = prog(t,w); return (solved(p)?1:0) + (p.write>=REPS?1:0); }
function test(){ return TESTS.find(t=>t.id===state.test); }

function renderTabs(){
  $("#tabs").innerHTML = TESTS.map((t,i)=>`<button class="tab" role="tab" aria-selected="${t.id===state.test}" data-test="${t.id}"><span class="dot" style="background:var(--tab${i+1})"></span>${esc(t.name)}</button>`).join("")
    + `<button class="tab soon" aria-disabled="true" tabindex="-1" title="Nye prøver kommer her">➕ Neste prøve</button>`;
  $("#tabs").querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>{ state.test=b.dataset.test; state.word=null; render(); });
}

function renderTotal(){
  const t = test();
  if (t.type==="story") { $("#starsTotal").textContent = "🌙 Lesetekst"; return 0; } const got = t.words.reduce((s,w)=>s+stars(t.id,w.id),0);
  $("#starsTotal").textContent = `⭐ ${got} / ${t.words.length*2}`;
  return got;
}

function renderOverview(){
  const t = test(); const got = renderTotal(); const max = t.words.length*2;
  $("#sheet").innerHTML = `
    <div class="ov-head"><h2>${esc(t.name)}: velg et ord</h2><p>${got} av ${max} stjerner</p></div>
    <div class="progress" aria-hidden="true"><span style="width:${got/max*100}%"></span></div>
    <div class="grid">${t.words.map(w=>{
      const s = stars(t.id,w.id);
      return `<button class="card ${s===2?"done":""}" style="--c:${w.c}" data-word="${w.id}" aria-label="${esc(label(w))}, ${s} av 2 stjerner">
        <span class="emo" aria-hidden="true">${w.emo}<small>${w.side}</small></span>
        <span class="w">${esc(label(w))}</span>
        <span class="st" aria-hidden="true">${s>0?"⭐".repeat(s):""}${"☆".repeat(2-s)}</span>
      </button>`;}).join("")}</div>
    ${got===max ? `<div class="finish">🏆 Du har klart alle ordene i ${esc(t.name)}. Kjempeinnsats 🎉</div>` : ""}
    <button class="reset" id="reset">Start prøven på nytt</button>
    <div id="confirmBox"></div>`;
  $("#sheet").querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{ state.word=b.dataset.word; render(); window.scrollTo({top:0}); });
  $("#reset").onclick=()=>{ $("#confirmBox").innerHTML = `<div class="confirm-reset">Vil du slette stjernene? <button class="btn ghost" id="yes">Ja, start på nytt</button> <button class="btn ghost" id="no">Nei</button></div>`;
    $("#yes").onclick=()=>{ progress[t.id]={}; save(); render(); };
    $("#no").onclick=()=>{ $("#confirmBox").innerHTML=""; };
  };
  if (got===max) confetti();
}

/* Engelsk stemme: velg en ekte engelsk (helst kvinnelig) stemme i stedet for maskinens standard */
let voice = null;
const FEMALE = /sonia|libby|maisie|hazel|susan|serena|kate|martha|stephanie|google uk english female|jenny|aria|ava|emma|michelle|samantha|allison|karen|moira|tessa|zira|female/i;
const MALE = /ryan|thomas|george|daniel|david|guy|mark|james|alex|fred|oliver|arthur|male/i;
function enVoices(){ try { return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); } catch(e){ return []; } }
function score(v){
  let s=0;
  if (/natural|neural|premium|enhanced/i.test(v.name)) s+=20;
  if (/online/i.test(v.name)) s+=5;
  if (FEMALE.test(v.name)) s+=10; else if (MALE.test(v.name)) s-=10;
  if (/en[-_]gb/i.test(v.lang)) s+=4; else if (/en[-_]us/i.test(v.lang)) s+=3;
  return s;
}
function setupVoices(){
  const vs = enVoices().sort((a,b)=>score(b)-score(a));
  const sel = $("#voiceSel"), note = $("#voiceNote");
  if (!sel) return;
  if (!vs.length){ sel.hidden=true; note.hidden=false; voice=null; return; }
  let saved=null; try { saved = localStorage.getItem("gloseboka-voice"); } catch(e){}
  voice = vs.find(v=>v.name===saved) || vs[0];
  sel.innerHTML = vs.map(v=>`<option value="${esc(v.name)}" ${v===voice?"selected":""}>${esc(v.name.replace(/^Microsoft |^Google /,"").replace(/ - English.*$/,"").replace(/ Online \(Natural\)/," (naturlig)"))} · ${v.lang.replace("_","-")}</option>`).join("");
  sel.hidden=false; note.hidden=true;
  sel.onchange = () => { voice = vs.find(v=>v.name===sel.value) || voice; try { localStorage.setItem("gloseboka-voice", voice.name); } catch(e){} speak("Hello. Let's learn English."); };
}
try { speechSynthesis.onvoiceschanged = setupVoices; } catch(e){}

function noVoice(){ try { const vs=speechSynthesis.getVoices().filter(v=>/^(nb|no|nn)[-_]?/i.test(v.lang)); return vs.sort((a,b)=>(/natural|online/i.test(b.name)?1:0)-(/natural|online/i.test(a.name)?1:0))[0]||null; } catch(e){ return null; } }
function speak(text, lang){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    try {
      if (!voice) setupVoices();
      const u = new SpeechSynthesisUtterance(text);
      if (lang==="no"){ const nv=noVoice(); if (nv) u.voice=nv; u.lang=nv?nv.lang:"nb-NO"; }
      else if (voice){ u.voice=voice; u.lang=voice.lang; } else u.lang="en-GB";
      u.rate=.85; u.onend=fin; u.onerror=fin; speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch(e){ fin(); }
    setTimeout(fin, 2000 + text.length*110);
  });
}

/* Hør og si etter: tar opp barnet, sjekker uttalen med talegjenkjenning der nettleseren støtter det */
let lastRec = null;
const wait = ms => new Promise(r=>setTimeout(r,ms));
const inFrame = (()=>{ try { return window.self !== window.top; } catch(e){ return true; } })();
let micMsg = "";

async function getMic(){
  micMsg = "";
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ micMsg = "Denne nettleseren kan ikke ta opp lyd. Bruk Chrome eller Edge."; return null; }
  try { return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){
    if (inFrame) micMsg = "Mikrofonen virker ikke når spillet er åpnet inne i Claude. Åpne GitHub-lenken eller filen i Chrome eller Edge.";
    else if (e && e.name==="NotAllowedError") micMsg = "Mikrofonen er blokkert. Trykk på hengelåsen 🔒 ved adressefeltet, velg «Tillat» for mikrofon og last siden på nytt.";
    else if (e && e.name==="NotFoundError") micMsg = "Fant ingen mikrofon på denne maskinen.";
    else micMsg = "Fikk ikke tilgang til mikrofonen.";
    return null;
  }
}

function startListen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  let r; try { r = new SR(); } catch(e){ return null; }
  r.lang = (voice && voice.lang) ? voice.lang.replace("_","-") : "en-GB";
  r.maxAlternatives = 5; r.interimResults = false; r.continuous = true;
  const out = { alts:[], err:null };
  const done = new Promise(res=>{
    r.onresult = ev => {
      const firsts = [];
      for (let i=0;i<ev.results.length;i++){ firsts.push(ev.results[i][0].transcript); for (const a of ev.results[i]) out.alts.push(a.transcript.toLowerCase().trim()); }
      out.joined = firsts.join(" ").toLowerCase().trim();
    };
    r.onerror = ev => { out.err = ev.error; };
    r.onend = () => res(out);
  });
  try { r.start(); } catch(e){ return null; }
  return { stop: () => { try { r.stop(); } catch(e){} }, done };
}

const words = t => t.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
const SOUNDALIKE = { plane:["plain"], scored:["scored","sword"], travel:["travel","travels"] };
function heardOk(out, text){
  const target = words(text);
  const cands = [out.joined||"", ...out.alts];
  return cands.some(a=>{
    const got = new Set(words(a));
    target.forEach(t=>(SOUNDALIKE[t]||[]).forEach(x=>{ if (got.has(x)) got.add(t); }));
    const hit = target.filter(x=>got.has(x)).length;
    return hit/target.length >= (target.length===1 ? 1 : .7);
  });
}

function meter(stream){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC();
    const src = ac.createMediaStreamSource(stream); const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize); const m = { peak:0, level:0, stop:()=>{ try{ ac.close(); }catch(e){} } };
    const tick = () => { if (ac.state==="closed") return; an.getFloatTimeDomainData(buf); let s=0; for (const v of buf) s+=v*v; m.level=Math.sqrt(s/buf.length); m.peak=Math.max(m.peak,m.level); requestAnimationFrame(tick); };
    tick(); return m;
  } catch(e){ return { peak:1, level:0, stop(){} }; }
}

async function sayAfter(text, btn, talk){
  btn.disabled = true;
  const secs = words(text).length>2 ? 5 : 3;
  talk.innerHTML = `<div class="talk listen"><span class="bubble">👂</span><b>Hør godt etter …</b></div>`;
  await speak(text); await wait(250);
  const turnHtml = (icon,s,lvl) => `<div class="talk mic"><span class="bubble pulse">${icon}</span><b>Din tur. Si «${esc(text)}» høyt</b><span class="count">${s}</span>${lvl!==undefined?`<div class="lvl" aria-hidden="true"><span style="width:${Math.min(100,Math.round(lvl*400))}%"></span></div>`:""}</div>`;
  const again = () => sayAfter(text, btn, talk);

  const stream = await getMic();
  if (stream){
    const chunks=[]; let rec; try { rec = new MediaRecorder(stream); } catch(e){ rec=null; }
    if (rec){ rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); }; rec.start(); }
    const m = meter(stream);
    const sr = startListen();
    const t0 = Date.now(); let shown = -1;
    while (Date.now()-t0 < secs*1000){
      const left = secs - Math.floor((Date.now()-t0)/1000);
      talk.innerHTML = turnHtml("🎙️", left, m.level); shown = left;
      await wait(120);
    }
    if (rec && rec.state!=="inactive"){ const stopped = new Promise(r=>rec.onstop=r); rec.stop(); await stopped; }
    if (sr) sr.stop();
    talk.innerHTML = `<div class="talk listen"><span class="bubble">🤔</span><b>Jeg lytter på det du sa …</b></div>`;
    const out = sr ? await Promise.race([sr.done, wait(4000).then(()=>null)]) : null;
    m.stop(); stream.getTracks().forEach(t=>t.stop());
    const blob = new Blob(chunks, { type: (rec && rec.mimeType) || "audio/webm" });
    if (lastRec) URL.revokeObjectURL(lastRec);
    lastRec = blob.size > 800 ? URL.createObjectURL(blob) : null;

    let verdict;
    const silent = m.peak < 0.015;
    if (out && heardOk(out, text)) { verdict = `<div class="fb ok">✅ Jeg hørte «${esc(text)}». ${pick(PRAISE)}</div>`; confetti(40); }
    else if (silent && !(out && out.alts.length)) verdict = `<div class="fb no">🤫 Jeg hørte ingenting. Sjekk at mikrofonen er på, snakk litt høyere og prøv igjen.</div>`;
    else if (out && out.alts.length) verdict = `<div class="fb hint">Jeg hørte «${esc(out.joined||out.alts[0])}». Det skal være «${esc(text)}». Hør på fasit og prøv igjen 💛</div>`;
    else if (out && out.err && out.err!=="no-speech" && out.err!=="aborted") verdict = `<div class="fb hint">Jeg kan ikke sjekke uttalen i denne nettleseren (${esc(out.err)}). Hør på deg selv og sammenlign med fasit.</div>`;
    else if (!sr) verdict = `<div class="fb hint">Denne nettleseren kan ikke sjekke uttalen. Hør på deg selv og sammenlign med fasit 🎧</div>`;
    else verdict = `<div class="fb hint">Jeg fikk ikke tak i ordet. Si det litt tydeligere og prøv igjen 🙂</div>`;

    talk.innerHTML = `${verdict}
      <div class="talk done"><span class="bubble">🎧</span>
        ${lastRec?`<button class="say" type="button" data-a="me">▶️ Hør meg selv</button>`:""}
        <button class="say" type="button" data-a="right">🔊 Hør fasit</button>
        <button class="say" type="button" data-a="again">🔁 Prøv igjen</button></div>`;
    const me = talk.querySelector('[data-a="me"]'); if (me) me.onclick = () => { try { new Audio(lastRec).play(); } catch(e){} };
    talk.querySelector('[data-a="right"]').onclick = () => speak(text);
    talk.querySelector('[data-a="again"]').onclick = again;
  } else {
    // Uten mikrofon: si høyt, men uten å late som vi har hørt barnet
    for (let s=secs;s>0;s--){ talk.innerHTML = turnHtml("🗣️", s); await wait(1000); }
    talk.innerHTML = `<div class="fb hint">🎙️ ${esc(micMsg)}</div>
      <div class="talk done"><span class="bubble">🗣️</span><b>Øv uten mikrofon:</b>
        <button class="say" type="button" data-a="right">🔊 Hør fasit</button>
        <button class="say" type="button" data-a="again">🔁 Prøv igjen</button></div>`;
    talk.querySelector('[data-a="right"]').onclick = () => speak(text);
    talk.querySelector('[data-a="again"]').onclick = again;
  }
  btn.disabled = false;
}

          <button class="btn alt" type="submit">Rett mine ord ✏️</button>
          <button class="btn ghost" type="button" id="clear">Visk ut</button>
        </div>
      </form>
      <div id="writeFb">${p.write>=REPS?`<div class="fb ok">⭐ Du har skrevet ordet riktig ${REPS} ganger før. Øv gjerne igjen.</div>`:""}</div>
    </section>

    <nav class="nav">
      ${prev?`<button class="btn ghost" id="prev">← ${prev.emo} ${esc(label(prev))}</button>`:"<span></span>"}
      ${next?`<button class="btn" id="next">${esc(label(next))} ${next.emo} →</button>`:`<button class="btn" id="back2">Ferdig, til oversikten 🏁</button>`}
    </nav>`;

  $("#back").onclick = () => { state.word=null; render(); };
  if ($("#back2")) $("#back2").onclick = () => { state.word=null; render(); };
  if (prev) $("#prev").onclick = () => { state.word=prev.id; render(); };
  if (next) $("#next").onclick = () => { state.word=next.id; render(); window.scrollTo({top:0}); };
  $("#say").onclick = () => speak(w.en);
  $("#sayEx").onclick = () => speak(w.ex);
  $("#afterEx").onclick = () => sayAfter(w.ex, $("#afterEx"), $("#talkEx"));
  $("#sayAfter").onclick = () => sayAfter(w.en, $("#sayAfter"), $("#talk"));
  const applyHide = () => $("#sheet").classList.toggle("hideword", !!state.hide);
  applyHide();
  $("#hide").onchange = e => { state.hide = e.target.checked; try{ localStorage.setItem("gloseboka-scr", state.hide?"1":""); }catch(_){} applyHide(); };
  let lastInp = $(`#w-${w.id}-1`);
  document.querySelectorAll(".wline input").forEach(i=>i.addEventListener("focus",()=>{ lastInp=i; }));
  document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{ lastInp.value += b.dataset.ch; if (lastInp.value.length>=w.en.length){ const nx=[...document.querySelectorAll(".wline input")].find(i=>!i.value); if(nx) lastInp=nx; } });
  $("#tileBack").onclick = () => { lastInp.value = lastInp.value.slice(0,-1); };

  $("#transForm").onsubmit = e => {
    e.preventDefault();
    const inp = $(`#trans-${w.id}`); const v = norm(inp.value);
    if (!v) { $("#transFb").innerHTML = `<div class="fb hint">Skriv et ord først 🙂</div>`; return; }
    if (R) {
      const e2 = v.replace(/^(to|a|an|the)\s+/,"");
      if (e2===w.en.toLowerCase()) {
        inp.className="inp ok"; p.transEn=true; p.transEnText=inp.value; save(); renderTotal();
        document.querySelectorAll(".secret").forEach(n=>n.hidden=false); document.querySelectorAll(".secret-note").forEach(n=>n.hidden=true);
        $("#transFb").innerHTML = `<div class="fb ok">⭐ ${pick(PRAISE)} ${esc(nod(w))} heter ${esc(w.en)} på engelsk.</div>`;
        confetti(40); speak(w.en);
      } else {
        p.triesEn=(p.triesEn||0)+1; save(); inp.className="inp no";
        let msg = `<div class="fb no">${pick(TRY)}</div>`;
        if (p.triesEn===2) msg += `<div class="fb hint">💡 Hint: ordet har ${w.en.length} bokstaver: <b style="font-family:var(--f-word);letter-spacing:3px">${esc(w.en[0])}${" _".repeat(w.en.length-1)}</b></div>`;
        if (p.triesEn>=3) msg += `<div class="fb hint">💡 Svaret er <b>${esc(w.en)}</b>. Skriv det inn, så får du stjernen.</div>`;
        $("#transFb").innerHTML = msg;
      }
      return;
    }
    if (w.no.map(norm).includes(v)) {
      inp.className="inp ok"; p.trans=true; p.transText=inp.value; save(); renderTotal();
      $("#transFb").innerHTML = `<div class="fb ok">⭐ ${pick(PRAISE)} ${esc(w.en)} betyr ${esc(w.show)}.</div>`;
      confetti(40);
    } else {
      p.tries = (p.tries||0)+1; save(); inp.className="inp no";
      let msg = `<div class="fb no">${pick(TRY)}</div>`;
      if (p.tries===2) msg += `<div class="fb hint">💡 Hint: ordet starter på «${esc(w.show[0])}» og passer til bildet.</div>`;
      if (p.tries>=3) msg += `<div class="fb hint">💡 Svaret er <b>${esc(w.show)}</b>. Skriv det inn, så får du stjernen.</div>`;
      $("#transFb").innerHTML = msg;
    }
  };

  $("#clear").onclick = () => { for(let i=1;i<=REPS;i++){ $(`#w-${w.id}-${i}`).value=""; $(`#wl${i}`).className="wline"; $(`#mk${i}`).textContent=""; $(`#fx${i}`).innerHTML=""; } $("#writeFb").innerHTML=""; $(`#w-${w.id}-1`).focus(); };

  for(let i=1;i<REPS;i++){ $(`#w-${w.id}-${i}`).addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); $(`#w-${w.id}-${i+1}`).focus(); } }); }

  $("#writeForm").onsubmit = e => {
    e.preventDefault(); let right=0; const target=w.en.toLowerCase();
    for(let i=1;i<=REPS;i++){
      const typed = $(`#w-${w.id}-${i}`).value.trim(); const ok = typed.toLowerCase()===target;
      $(`#wl${i}`).className = "wline " + (ok?"ok":"no");
      $(`#mk${i}`).textContent = ok ? "✅" : (typed ? "🔸" : "✏️");
      if (ok) { right++; $(`#fx${i}`).innerHTML=""; continue; }
      if (!typed) { $(`#fx${i}`).innerHTML = `<span class="lbl">Denne linja er tom.</span>`; continue; }
      let out=""; const tl=typed.toLowerCase(); const len=Math.max(tl.length,target.length);
      for(let k=0;k<len;k++){
        const a=tl[k], b=target[k];
        if (a===undefined) out+=`<span class="m">_</span>`;
        else if (a===b) out+=`<span class="g">${esc(typed[k])}</span>`;
        else out+=`<span class="r">${esc(typed[k])}</span>`;
      }
      $(`#fx${i}`).innerHTML = `<span class="lbl">Du skrev:</span>${out} <span class="lbl" style="margin-left:10px">Riktig:</span><span class="g">${esc(w.en)}</span>`;
    }
    p.write = Math.max(p.write||0, right); save(); renderTotal();
    let msg;
    if (right===REPS){ msg=`<div class="fb ok">⭐ ${REPS} av ${REPS}. ${pick(PRAISE)}</div>`; confetti(); }
    else if (right>=1) msg=`<div class="fb ok">${right} av ${REPS} riktige. Bra jobba 😊 Se på de oransje bokstavene og prøv de linjene igjen.</div>`;
        else msg=`<div class="fb hint">Ingen helt riktige ennå. Trykk 🔊 og se på ordet, så prøver vi igjen 💛</div>`;
    $("#writeFb").innerHTML = msg;
  };
}

function renderDir(){
  document.querySelectorAll("[data-dir]").forEach(b=>{ b.setAttribute("aria-pressed", b.dataset.dir===state.dir); b.onclick=()=>{ state.dir=b.dataset.dir; try{ localStorage.setItem("gloseboka-dir",state.dir); }catch(e){} render(); }; });
}
function render(){ $("#sheet").classList.remove("hideword"); renderDir(); renderTabs(); renderTotal(); if (test().type==="story") return renderStory(); state.word ? renderWord() : renderOverview(); }

/* Konfetti */
const cv = $("#confetti"), cx = cv.getContext("2d"); let bits=[], running=false;
function confetti(n=120){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#ff7a59","#ffc93c","#4cc3ff","#5fd39a","#b388ff","#ff8fb8"];
  for(let i=0;i<n;i++) bits.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.3,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,s:5+Math.random()*6,c:cols[i%cols.length],a:Math.random()*6});
  if(!running){ running=true; requestAnimationFrame(tick); }
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.a+=.1; cx.save(); cx.translate(b.x,b.y); cx.rotate(b.a); cx.fillStyle=b.c; cx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); cx.restore(); });
  bits = bits.filter(b=>b.y<cv.height+20);
  if(bits.length) requestAnimationFrame(tick); else { running=false; cx.clearRect(0,0,cv.width,cv.height); }
}

render();
setupVoices();
</script>

</body>
